[project]
name = "qse3-sim"
version = "0.1.0"
description = "Kinematics and dynamics of a nanoscale robot on Min(1,3) x SU(N)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "typer>=0.27.2",
]

[project.scripts]
qse3-sim = "qse3_sim.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "RUF"]
# typer.Option in a default is the documented idiom, not a mutable default
ignore = ["B008"]
